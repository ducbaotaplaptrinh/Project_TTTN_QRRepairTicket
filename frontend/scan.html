<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu Tiếp Nhận Máy | TTTN</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="glass-panel">
        
        <div id="loadingState">
            <div class="loader"></div>
            <p class="scan-status" style="color: var(--text-muted);">Đang kiểm tra kết nối...</p>
        </div>

        <div id="errorState" style="display: none;">
            <div class="scan-status">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--error)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom: 15px;"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
                <h2 style="color: var(--error); margin-bottom: 10px;">Lỗi!</h2>
                <p id="errorScanMsg" style="color: var(--text-muted);">Mã QR đã hết hạn hoặc không hợp lệ.</p>
            </div>
        </div>
        
        <div id="formState" style="display: none;">
            <h2 style="margin-bottom: 5px;">Tiếp Nhận Máy</h2>
            <p style="text-align: center; color: var(--text-muted); margin-bottom: 25px; font-size: 0.9rem;">Vui lòng điền thông tin để chúng tôi phục vụ bạn tốt nhất</p>
            
            <form id="submitForm">
                <div class="form-group">
                    <label>Họ và tên (*)</label>
                    <input type="text" id="fullName" placeholder="VD: Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label>Số điện thoại (*)</label>
                    <input type="tel" id="phone" placeholder="VD: 0912345678" required pattern="[0-9]{10}">
                </div>
                <div class="form-group">
                    <label>Email (Không bắt buộc)</label>
                    <input type="email" id="email" placeholder="VD: email@gmail.com">
                </div>
                <div class="form-group">
                    <label>Tên Thiết Bị (Không bắt buộc)</label>
                    <input type="text" id="deviceName" placeholder="VD: Laptop Dell Inspiron">
                </div>
                <div class="form-group">
                    <label>Mô tả lỗi đang gặp (*)</label>
                    <textarea id="issueDescription" rows="3" placeholder="Máy của bạn đang bị lỗi gì?" required></textarea>
                </div>
                
                <div class="error-msg" id="submitErrorMsg"></div>
                <div class="success-msg" id="submitSuccessMsg"></div>
                
                <button type="submit" id="submitTicketBtn">GỬI YÊU CẦU</button>
            </form>
        </div>
        
    </div>
    <script src="js/api.js"></script>
    <script src="js/scan.js"></script>
</body>
</html>
